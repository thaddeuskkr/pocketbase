name: Publish PocketBase

on:
  push:
  schedule:
    # 03:17 and 15:17 UTC (11:17 and 23:17 Singapore time).
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "PocketBase version (blank follows latest stable; older versions get exact tags only)"
        required: false
        type: string
      force:
        description: "Rebuild even when all image tags already exist"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pocketbase-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      images: ${{ steps.release.outputs.images }}
      tags: ${{ steps.release.outputs.tags }}
      ghcr: ${{ steps.release.outputs.ghcr }}
      dockerhub: ${{ steps.release.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve PocketBase release and registries
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release.py resolve
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR for image checks
        if: steps.release.outputs.ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub for image checks
        if: steps.release.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check whether publication is needed
        id: check
        env:
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
          FORCE_BUILD: ${{ steps.release.outputs.force }}
        run: python3 scripts/release.py check
      - name: Summarize release check
        env:
          PB_VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.check.outputs.build }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          {
            echo "PocketBase version: ${PB_VERSION}"
            echo "Build needed: ${BUILD}"
            echo "Publishing enabled: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: needs.prepare.outputs.ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build native image and push by digest to enabled registries
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: ${{ needs.prepare.outputs.publish == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || format('type=oci,dest={0}/pocketbase-{1}.tar', runner.temp, matrix.arch) }}
          tags: ${{ needs.prepare.outputs.images || format('pocketbase:build-{0}', matrix.arch) }}
          build-args: |
            PB_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pocketbase-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pocketbase-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
      - name: Save architecture digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${IMAGE_ARCH}.txt"
      - name: Upload architecture digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: needs.prepare.outputs.ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish combined AMD64 and ARM64 manifests
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: python3 scripts/release.py merge
