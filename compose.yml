services:
  pocketbase:
    image: ${POCKETBASE_IMAGE:-pocketbase:local}
    build:
      context: .
      args:
        PB_VERSION: ${PB_VERSION:-0.40.6}
    restart: unless-stopped
    ports:
      - "${POCKETBASE_BIND_ADDRESS:-127.0.0.1}:${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pb_data:/pb/pb_data
      - pb_migrations:/pb/pb_migrations
      # Optional application code/assets (create these host directories first):
      # - ./pb_hooks:/pb/pb_hooks:ro
      # - ./pb_public:/pb/pb_public:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  pb_data:
  pb_migrations:
